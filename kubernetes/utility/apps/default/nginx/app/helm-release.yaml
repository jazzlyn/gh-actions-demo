---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx
spec:
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
  interval: 15m
  install:
    remediation:
      retries: 5
  upgrade:
    cleanupOnFail: true
  values:
    controllers:
      nginx:
        containers:
          app:
            image:
              repository: nginx
              tag: "1.27"
